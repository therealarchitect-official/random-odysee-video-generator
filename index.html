<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Odysee Video</title>
</head>
<body style="margin:0; width:100%; height:100%; overflow:hidden;">
  <iframe
    id="video"
    title="Random Odysee video"
    allow="autoplay; fullscreen"
    allowfullscreen
    frameborder="0"
    style="position:fixed; inset:0; width:100vw; height:100vh; border:0;"
  ></iframe>
  <script src="./websites.js"></script>
  <script>
    const videos = window.odyseeVideos || [];
    const uniqueVideos = [...new Map(
      videos
        .filter(video => video && typeof video.url === "string" && video.url.startsWith("https://odysee.com/"))
        .map(video => [video.url, video])
    ).values()];

    if (uniqueVideos.length) {
      const video = uniqueVideos[Math.floor(Math.random() * uniqueVideos.length)];
      const frame = document.getElementById("video");
      frame.src = video.url;
      frame.title = video.name || "Random Odysee video";
    }
  </script>
</body>
</html>
