<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Odysee Video</title>
</head>
<body style="margin:0; width:100%; height:100%; overflow:hidden;">
  <iframe
    id="video"
    title="Random Odysee video"
    allow="autoplay; fullscreen"
    allowfullscreen
    frameborder="0"
    style="position:fixed; inset:0; width:100vw; height:100vh; border:0;"
  ></iframe>
  <script src="./websites.js"></script>
  <script>
    (async function () {
      const frame = document.getElementById("video");
      try {
        const videos = await window.loadOdyseeVideos();
        if (!videos.length) throw new Error("Odysee search returned no unique video claims.");

        // Select uniformly from distinct claims. Only this one iframe is created.
        const index = Math.floor(Math.random() * videos.length);
        const selected = videos[index];
        frame.title = selected.name;
        frame.src = selected.url;
        console.info("Selected 1 of " + videos.length + " unique Odysee videos.");
      } catch (error) {
        console.error("Could not load a random Odysee video:", error);
      }
    })();
  </script>
</body>
</html>
