<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Odysee Video</title>
</head>
<body style="margin:0; overflow:hidden;">
  <iframe
    id="video"
    title="Random Odysee video"
    allow="autoplay; fullscreen"
    allowfullscreen
    frameborder="0"
    style="position:fixed; inset:0; width:100vw; height:100vh; border:0;"
  ></iframe>
  <script src="websites.js"></script>
  <script>
    (async function () {
      const frame = document.getElementById("video");
      try {
        const videos = await window.loadOdyseeVideos();
        if (!videos.length) throw new Error("No Odysee videos were returned.");
        const video = videos[Math.floor(Math.random() * videos.length)];
        frame.title = video.name;
        frame.src = video.url;
      } catch (error) {
        console.error("Could not load the Odysee video list:", error);
        frame.title = "Odysee videos could not be loaded";
      }
    })();
  </script>
</body>
</html>
